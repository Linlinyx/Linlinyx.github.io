{% if site.post_search %}

<!-- 覆盖层（点击搜索图标弹出） -->
<div id="beautifuljekyll-search-overlay">
  <div id="nav-search-exit" title="Exit search">✕</div>
  <input type="text" id="nav-search-input" placeholder="搜索文章...">
  <ul id="search-results-container"></ul>
</div>

<script src="https://unpkg.com/simple-jekyll-search@latest/dest/simple-jekyll-search.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    var searchJson = '{{ site.baseurl }}/searchcorpus.json';
    // 绑定内联搜索框（新添加的）
    var inlineInput = document.getElementById('nav-search-input-inline');
    if (inlineInput) {
      SimpleJekyllSearch({
        searchInput: inlineInput,
        resultsContainer: document.getElementById('search-results-container'),
        json: searchJson,
        searchResultTemplate: '<li><a href="{url}">{title}</a></li>',
        noResultsText: '没有找到文章'
      });
    }

    // 绑定覆盖层搜索框（原有的）
    var overlayInput = document.getElementById('nav-search-input');
    if (overlayInput) {
      SimpleJekyllSearch({
        searchInput: overlayInput,
        resultsContainer: document.getElementById('search-results-container'),
        json: searchJson,
        searchResultTemplate: '<li><a href="{url}">{title}</a></li>',
        noResultsText: '没有找到文章'
      });
    }
  });
</script>

{% endif %}
